[package]
name = "sewa-agent"
description = "The node side of sewa: runs on each machine and reports to the controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "sewa-agent"
path = "src/main.rs"

[dependencies]
clap.workspace = true
nix.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sewa-approval = { path = "../approval" }
sha2.workspace = true
toml.workspace = true
ureq.workspace = true
uuid = { workspace = true, features = ["v7"] }

[build-dependencies]
prost-build.workspace = true
protox.workspace = true

[dev-dependencies]
sewa-approval = { path = "../approval", features = ["testing"] }
tempfile.workspace = true

[lints]
workspace = true
