[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
http-body-util = "0.1"
nix = { version = "0.30", features = ["fs", "hostname", "user"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
prost = "0.14"
prost-build = { version = "0.14", default-features = false }
protox = "0.10"
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "uuid",
] }
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Full debug info makes each test binary large to link, and links run in
# parallel. Line tables are enough for backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
